name: OpenGene Lab CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Build Datasets
        run: |
          python main.py build-data

      - name: Run Test Simulation
        run: |
          python main.py run --population-size 200 --generations 50 --seed 42 --output test_results

      - name: Query Dataset CLI
        run: |
          python main.py query conditions --search "Marfan"
          python main.py query phenotypes --search "Arachnodactyly"

      - name: Run System Doctor Diagnostics
        run: |
          python main.py doctor
